name: Deploy static site to TransIP

on:
  push:
    branches:
      - main

concurrency:
  group: transip-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render and validate news
        run: |
          python3 scripts/news.py --write
          python3 scripts/usage_costs.py --write
          python3 scripts/module_screenshots.py --check
          python3 scripts/module_prices.py --check
          python3 scripts/demo_product_assets.py --check
          python3 scripts/external_links.py --check

      - name: Build and validate site search
        run: |
          python3 scripts/search_index.py --write
          node --check assets/js/site-search.js
          node scripts/test_site_search.cjs

      - name: Generate and validate sitemap and metadata
        run: |
          python3 scripts/check_screenshot_galleries.py
          python3 scripts/sitemap.py --write
          python3 scripts/metadata.py --check

      - name: Validate module pricing and dependencies
        run: |
          node --check assets/js/modular-webapp.js
          node --check assets/js/demo-access.js
          node --check assets/js/module-demo.js
          node --check assets/js/marketplace-demo-data.js
          node --check assets/js/demo-page-catalogue.js
          node --check assets/js/demo-client-data.js
          node --check assets/js/demo-full-workspace.js
          node --check assets/js/usage-costs.js
          node scripts/test_marketplace_demo.cjs
          node scripts/test_demo_client.cjs
          node scripts/test_modular_webapp.cjs
          node scripts/test_usage_costs.cjs

      - name: Validate business scan
        run: |
          php -l api/bedrijfsscan.php
          php -l api/scan-lib.php
          php -l api/demo-access.php
          python3 scripts/test_demo_access.py
          php -l contact.php
          php scripts/test-business-scan.php
          node --check assets/js/bedrijfsscan.js

      - name: Prepare private site configuration
        env:
          OPTICORE_SCAN_API_KEY: ${{ secrets.OPTICORE_SCAN_OPENAI_API_KEY }}
          OPTICORE_DEMO_AUTH_CONFIG: ${{ secrets.OPTICORE_DEMO_AUTH_CONFIG }}
        run: |
          python3 scripts/write_scan_config.py
          python3 scripts/write_demo_auth_config.py

      - name: Upload private configuration outside the webroot
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.TRANSIP_SFTP_HOST }}
          username: ${{ secrets.TRANSIP_SFTP_USERNAME }}
          password: ${{ secrets.TRANSIP_SFTP_PASSWORD }}
          port: ${{ secrets.TRANSIP_SFTP_PORT }}
          local_path: ./.scan-deploy/*
          remote_path: ${{ secrets.TRANSIP_SFTP_TARGET }}/../opticore-scan-private/
          sftp_only: false
          sftpArgs: '-p'
          delete_remote_files: false

      - name: Deploy website files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.TRANSIP_SFTP_HOST }}
          username: ${{ secrets.TRANSIP_SFTP_USERNAME }}
          password: ${{ secrets.TRANSIP_SFTP_PASSWORD }}
          port: ${{ secrets.TRANSIP_SFTP_PORT }}
          local_path: ./
          remote_path: ${{ secrets.TRANSIP_SFTP_TARGET }}
          sftp_only: false
          delete_remote_files: true
          rsyncArgs: >-
            --exclude=.git
            --exclude=.scan-deploy
            --exclude=.github
            --exclude=README.md
            --exclude=.gitignore
            --exclude=.env
            --exclude=node_modules
            --exclude=backups
            --exclude=*.zip
            --exclude=*.bak
            --exclude=*.tmp
            --exclude=scripts
            --exclude=docs
            --exclude=content

      - name: Remove temporary site configuration
        if: always()
        run: python3 -c "from pathlib import Path; [p.unlink(missing_ok=True) for p in [Path('.scan-deploy/config.json'), Path('.scan-deploy/demo-auth.json')]]"
